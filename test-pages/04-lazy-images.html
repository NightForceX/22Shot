<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Lazy Images</title>
<style>body{font-family:system-ui;margin:16px}img{display:block;width:min(600px,100%);height:200px;background:#ddd;margin:24px 0;object-fit:cover}</style>
</head>
<body>
<h1>Lazy-loaded images</h1>
<div id="c"></div>
<script>
const c=document.getElementById('c');
for(let i=0;i<30;i++){
  const img=document.createElement('img');
  img.loading='lazy';
  img.alt=`Lazy ${i}`;
  img.src=`https://picsum.photos/seed/ps${i}/600/200`;
  c.appendChild(img);
  const p=document.createElement('p');
  p.textContent=`Caption ${i}`;
  c.appendChild(p);
}
</script>
</body></html>
