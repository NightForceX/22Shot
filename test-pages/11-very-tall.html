<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Very Tall Page</title>
<style>body{font-family:system-ui;margin:16px}.block{height:800px;border-bottom:1px dashed #999;padding:12px}</style>
</head>
<body>
<h1>Very tall page</h1>
<script>
for(let i=1;i<=40;i++){
  document.write(`<div class="block">Tall block ${i}</div>`);
}
</script>
</body></html>
